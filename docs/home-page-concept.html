<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gr8 Launcher · Home concept</title>
<style>
@font-face{font-family:Mojangles;src:url('../.assets/font/mojangles-v2.otf')}
*{box-sizing:border-box}body{margin:0;padding:16px;background:#080808;color:#f6f4f2;font:14px 'Segoe UI',system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent,#46ba34);outline-offset:3px}.review{max-width:1366px;margin:0 auto 12px;display:flex;align-items:center;gap:16px;color:#aaa;font-size:12px}.review strong{color:#eee}.review label{display:flex;align-items:center;gap:7px}.review select{background:#181818;color:#eee;border:1px solid #444;border-radius:5px;padding:4px}.review .note{margin-left:auto}
.launcher{--bg:#0e0c0a;--surface:#161310;--card:#1f1b17;--border:#3a322a;--accent:#46ba34;--on-accent:#0e0c0a;--text:#f6f4f2;--muted:#b3a9a0;max-width:1366px;height:650px;margin:auto;background:#050505;color:var(--text);border:1px solid #28231f;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.launcher.large{height:768px}.titlebar{height:64px;flex-shrink:0;display:flex;align-items:center;padding:0 22px;gap:20px}.brand{font:22px Mojangles,sans-serif;white-space:nowrap}.brand em{font-style:normal;color:var(--accent)}.nav{display:flex;gap:4px;padding:5px;background:#090909;border-radius:12px;margin:auto}.nav button,.window button{border:0;background:transparent;color:var(--muted);padding:9px 17px;border-radius:8px}.nav .active{color:var(--accent);background:color-mix(in srgb,var(--accent) 19%,transparent)}.nav svg{display:block;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.window{display:flex}.window button{padding:9px 12px}.window .close{color:var(--accent)}
.body{margin:0 10px 10px;border-radius:10px;background:var(--bg);padding:20px 28px 16px;flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(220px,1fr) auto auto;gap:16px}.welcome{display:flex;justify-content:space-between;align-items:center}.welcome p{margin:0;font-size:13px;color:var(--muted)}.account{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:5px 9px;font-size:12px}.account img{width:24px;height:24px;image-rendering:pixelated;border-radius:4px}
.hero{position:relative;min-height:220px;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--surface);isolation:isolate}.hero::before{content:'';position:absolute;inset:0;background-image:var(--art);background-position:center;background-size:cover;z-index:-2}.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--surface) 95%,transparent) 0%,color-mix(in srgb,var(--surface) 76%,transparent) 38%,color-mix(in srgb,var(--surface) 10%,transparent) 100%);z-index:-1}.hero-content{height:100%;padding:26px 32px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:11px;max-width:75%}.eyebrow{font:14px Mojangles,sans-serif;color:var(--muted);letter-spacing:.3px}.hero h1{font-size:42px;line-height:1.08;margin:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metadata{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.badge{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 7px;border-radius:5px;color:var(--text);font-size:11px}.ready{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}.actions{display:flex;align-items:center;gap:8px;margin-top:3px}.play{border:0;border-radius:8px;padding:11px 26px;min-width:150px;background:var(--accent);color:var(--on-accent);font-weight:600}.secondary{border:1px solid var(--border);border-radius:8px;background:color-mix(in srgb,var(--surface) 83%,transparent);color:var(--text);padding:10px 13px}.play:disabled{opacity:.7;cursor:default}
.shelf-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.shelf-head h2{font-size:14px;margin:0}.shelf-head span{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}.text-button{color:var(--muted);background:transparent;border:0;padding:0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 116px;gap:12px}.profile{height:130px;border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;color:#f6f4f2;background:#161310;text-align:left;padding:0;isolation:isolate}.profile::before{content:'';inset:0;position:absolute;background:var(--art) center/cover;z-index:-2}.profile::after{content:'';inset:0;position:absolute;background:linear-gradient(0deg,rgba(8,8,8,.92),rgba(8,8,8,0) 90%);z-index:-1}.profile:hover{border-color:var(--accent)}.profile[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:-2px}.card-label{position:absolute;left:14px;right:14px;bottom:12px}.card-label strong{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-label small{font-size:11px;color:#d2cec9;display:block;margin-top:4px}.selected-mark{position:absolute;right:10px;top:10px;display:none;background:var(--accent);color:var(--on-accent);font-size:11px;padding:3px 6px;border-radius:5px}.profile[aria-pressed=true] .selected-mark{display:block}.extra{display:none}.new{border:1px dashed var(--border);border-radius:12px;background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px}.new b{font-size:26px;font-weight:300}.footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}.footer button{font-size:12px}.progress{height:3px;background:var(--accent);width:42%;border-radius:2px;margin-top:10px;display:none}.launcher[data-state=downloading] .progress{display:block}.notice{position:absolute;right:20px;bottom:20px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px 16px;display:none;z-index:3;box-shadow:0 5px 25px #0008}
@media(min-width:1300px){.cards{grid-template-columns:repeat(4,minmax(0,1fr)) 116px}.extra{display:block}.hero h1{font-size:48px}.profile{height:150px}}@media(max-width:850px){body{padding:8px}.review{flex-wrap:wrap}.review .note{margin-left:0}.titlebar{padding:0 12px;gap:6px}.nav button{padding:8px}.brand{font-size:17px}.body{padding:16px;overflow:auto;grid-template-rows:auto 280px auto auto}.hero-content{max-width:100%;padding:24px}.hero h1{font-size:32px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.new{min-height:100px}.window button{padding:8px}.welcome p{font-size:11px}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}.hero h1{animation:appear .22s ease-out}@keyframes appear{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<div class="review"><strong>Home concept</strong><label>Theme <select id="theme"><option>Earth 2</option><option>Sculk</option><option>Amethyst</option></select></label><label>Launch state <select id="state"><option value="ready">Ready</option><option value="downloading">Downloading</option><option value="running">Running</option></select></label><label>Frame <select id="frame"><option value="650">650px tall</option><option value="768">768px tall</option></select></label><span class="note">OneClient-inspired layout · illustrative preview</span></div>
<div class="launcher" id="launcher" data-state="ready" style="position:relative">
<header class="titlebar"><div class="brand">Gr<em>8</em> Launcher</div><nav class="nav" aria-label="Launcher navigation"><button class="active" aria-label="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></button><button aria-label="Library"><svg viewBox="0 0 24 24"><path d="M4 15v5h16v-5M12 3v12m-5-5 5 5 5-5"/></svg></button><button aria-label="Mods and modpacks"><svg viewBox="0 0 24 24"><path d="M4 4h5c-1-4 7-4 6 0h5v5c4-1 4 7 0 6v5h-5c1-4-7-4-6 0H4v-5c4 1 4-7 0-6Z"/></svg></button><button aria-label="Skins"><svg viewBox="0 0 24 24"><path d="M10 6a2 2 0 1 1 3 2l-1 2M12 10 3 18h18Z"/></svg></button><button aria-label="Options"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18M8 3v6m8 0v6M8 15v6"/></svg></button></nav><div class="window" aria-label="Window controls"><button aria-label="Minimize">−</button><button aria-label="Maximize">□</button><button class="close" aria-label="Close">×</button></div></header>
<main class="body"><div class="welcome"><p>Welcome back. Your next adventure is ready.</p><button class="account" data-notice="The account chip opens the updated Accounts page."><img src="../.assets/icons/icon_faces/creeper.png" alt=""><span>Player</span><span aria-hidden="true">⌄</span></button></div>
<section class="hero" id="hero" style="--art:url('../.assets/banners/farmhouse.png')" aria-label="Selected Minecraft profile"><div class="hero-content"><div class="eyebrow">MINECRAFT JAVA EDITION</div><h1 id="profile-title">Survival</h1><div class="metadata"><span id="profile-details">1.21.4 · Vanilla</span><span class="badge" id="instance">Separate instance</span></div><div class="ready"><i class="dot"></i><span id="status-text">Installed · Ready to play</span></div><div class="actions"><button class="play" id="play">▶ &nbsp; Play</button><button class="secondary" data-notice="Edit opens the updated installation editor.">Edit</button><button class="secondary" data-notice="Folder opens this profile's game directory.">Folder</button></div></div></section>
<section aria-label="Your library"><div class="shelf-head"><h2>Your library <span>4 profiles</span></h2><button class="text-button" data-notice="Manage all opens the complete Library, in its saved order.">Manage all →</button></div><div class="cards" id="cards">
<button class="profile" data-profile="survival" aria-pressed="true" style="--art:url('../.assets/banners/farmhouse.png')"><span class="selected-mark">Selected</span><span class="card-label"><strong>Survival</strong><small>1.21.4 · Vanilla · Installed</small></span></button>
<button class="profile" data-profile="fabric" aria-pressed="false" style="--art:url('../.assets/banners/portal.png')"><span class="selected-mark">Selected</span><span class="card-label"><strong>Fabric Adventure</strong><small>1.21.1 · Fabric · Installed</small></span></button>
<button class="profile" data-profile="latest" aria-pressed="false" style="--art:url('../.assets/banners/hero_bg.png')"><span class="selected-mark">Selected</span><span class="card-label"><strong>Latest Release</strong><small>1.21.4 · Vanilla · Install on launch</small></span></button>
<button class="profile extra" data-profile="creative" aria-pressed="false" style="--art:url('../.assets/banners/farmhouse.png')"><span class="selected-mark">Selected</span><span class="card-label"><strong>Creative Workshop</strong><small>1.21.1 · NeoForge · Installed</small></span></button>
<button class="new" data-notice="New Profile opens the updated two-pane installation screen."><b>+</b>New Profile</button></div><div class="progress" aria-hidden="true"></div></section>
<footer class="footer"><span id="footer-status">Ready to play</span><button class="text-button" data-notice="Logs opens the existing floating game log window.">▤ &nbsp; Logs</button></footer></main><div class="notice" id="notice" role="status"></div></div>
<script>
const launcher=document.getElementById('launcher');
const profiles={survival:{name:'Survival',details:'1.21.4 · Vanilla',art:'farmhouse.png',installed:true,instance:true},fabric:{name:'Fabric Adventure',details:'1.21.1 · Fabric',art:'portal.png',installed:true,instance:true},latest:{name:'Latest Release',details:'1.21.4 · Vanilla',art:'hero_bg.png',installed:false,instance:false},creative:{name:'Creative Workshop',details:'1.21.1 · NeoForge',art:'farmhouse.png',installed:true,instance:true}};
let selected='survival';const state=document.getElementById('state');const play=document.getElementById('play');
function render(){const p=profiles[selected];document.getElementById('profile-title').textContent=p.name;document.getElementById('profile-details').textContent=p.details;document.getElementById('hero').style.setProperty('--art',`url('../.assets/banners/${p.art}')`);document.getElementById('instance').hidden=!p.instance;launcher.dataset.state=state.value;const busy=state.value!=='ready';document.querySelectorAll('[data-profile]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.profile===selected));b.disabled=busy});play.disabled=state.value==='running';play.textContent=state.value==='downloading'?'×  Cancel':state.value==='running'?'Running…':p.installed?'▶  Play':'↓  Install & Play';document.getElementById('status-text').textContent=state.value==='downloading'?'Downloading Minecraft · 42% · About 30s remaining':state.value==='running'?'Minecraft is running':p.installed?'Installed · Ready to play':'Not installed · Downloads when you play';document.getElementById('footer-status').textContent=state.value==='ready'?'Ready to play':state.value==='downloading'?'Downloading · 42%':'Minecraft is running'}
document.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.profile;render()}));state.addEventListener('change',render);play.addEventListener('click',()=>{state.value=state.value==='downloading'?'ready':profiles[selected].installed?'running':'downloading';render()});
const themes={'Earth 2':['#0e0c0a','#161310','#1f1b17','#3a322a','#46ba34','#0e0c0a','#f6f4f2','#b3a9a0'],Sculk:['#090d12','#0f161e','#15202b','#1e3040','#17899c','#090d12','#eef7f8','#8aa4b0'],Amethyst:['#0d0a13','#15101f','#1d162b','#36294f','#7f4db8','#ffffff','#f4f0fa','#afa3c7']};document.getElementById('theme').addEventListener('change',e=>{['bg','surface','card','border','accent','on-accent','text','muted'].forEach((token,i)=>launcher.style.setProperty('--'+token,themes[e.target.value][i]))});document.getElementById('frame').addEventListener('change',e=>launcher.classList.toggle('large',e.target.value==='768'));
let timer;document.querySelectorAll('[data-notice]').forEach(b=>b.addEventListener('click',()=>{const n=document.getElementById('notice');n.textContent=b.dataset.notice;n.style.display='block';clearTimeout(timer);timer=setTimeout(()=>n.style.display='none',3500)}));render();
</script>
</body>
</html>
